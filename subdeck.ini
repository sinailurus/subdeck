# ============================================
#  SubDeck 配置文件
#  改完保存，重新启动 SubDeck 生效
# ============================================

# 数据目录：订阅数据、上传图片都存在这里。
# 留空 = 本文件旁边的 data 文件夹。
# 想放到别处就写完整路径，例如 D:\SubDeckData
# （换目录=搬家：把整个 data 文件夹复制过去即可，数据不会丢）
data_dir =

# 访问密码：设了之后，打开页面和手机访问都要先输这个密码。
# 留空 = 不启用（只在自己家里电脑/手机访问，可以不设）。
password =

# 端口：留空 = 8017。若被其他程序占用，会自动顺延到 8018 并在窗口提示。
port =
