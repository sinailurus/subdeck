# SubDeck · 绿联 UGOS Pro 应用包内编排文件
# 镜像随 .upk 包内置（rootfs_<arch>/images/*.tar），tag 与 tar 内一致，安装时不联网拉取
services:
  subdeck:
    image: ghcr.io/sinailurus/subdeck:1.6.18
    user: "0:0"                                          # 必须保留：配合 RUN_AS_ROOT 以 root 运行（UGOS 数据文件夹为 000+ACL 模型，降权用户无法稳定写入）
    restart: unless-stopped
    ports:
      - "8300:8000"                                      # 应用固定对外端口 8300，容器内服务端口 8000
    volumes:
      - type: bind
        source: ${DATA_PATH}
        target: /data
        read_only: false
    environment:
      TZ: ${TZ}
      RUN_AS_ROOT: "1"                                   # 入口脚本跳过降权直接以 root 运行（UGOS Pro 数据文件夹策略所致，详见 docker-entrypoint.sh）
      DATA_DIR: /data
      AUTH_PASSWORD: ${AUTH_PASSWORD}                    # 安装向导「网页登录密码」配置项，对应 project.yaml parameters
