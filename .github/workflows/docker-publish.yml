# GitHub Actions：推送后自动构建 x86 + ARM 双架构镜像并发布到 GHCR
name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force_release:
        description: 为 beta 标签强制发布 Release（仅指定测试版需要时开启）
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU（ARM 模拟）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata（标签）
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # v1.6.0 起：tag 推送时打包 Windows 一键部署包并挂到 GitHub Release
  # 2026-11-25 起beta标签不再发 Release（镜像照常推送），特例走 dispatch 的 force_release 开关
  build-windows:
    if: startsWith(github.ref, 'refs/tags/') && (!contains(github.ref, '-beta') || inputs.force_release)
    runs-on: windows-latest
    permissions:
      contents: write   # 创建 Release 并上传附件
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller subdeck.spec --noconfirm

      - name: 组装发行包（exe + ini 模板 + 使用说明）
        id: zip
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          import os, zipfile
          tag = os.environ["TAG_NAME"].lstrip("v")
          out = f"SubDeck-{tag}-windows-x64.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("dist/SubDeck.exe", "SubDeck.exe")
              z.write("packaging/subdeck.ini", "subdeck.ini")
              z.write("packaging/使用说明.txt", "使用说明.txt")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"zip={out}\n")
          print("built", out)

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip }}
          body: |
            **Windows 一键部署包**：下载 SubDeck-*-windows-x64.zip → 解压 → 双击 SubDeck.exe。
            **macOS 部署包**（v1.6.1 起）：按芯片下载 apple-silicon（M 系列）或 intel 包 → 解压 → 双击 SubDeck；首次打开需在「系统设置 → 隐私与安全性」放行，详见包内「使用说明-Mac.txt」。
            使用方法见压缩包内说明文件。Docker / NAS 用户请继续拉取镜像。

  # v1.6.1 起：tag 推送时同时打包 macOS 双架构部署包并挂到 GitHub Release
  # PyInstaller 不支持交叉编译：Intel 用 macos-15-intel，Apple Silicon 用 macos-15（M1）。
  # 注：macos-13/14 已于 2026 年退役，勿回退。
  build-macos:
    if: startsWith(github.ref, 'refs/tags/') && (!contains(github.ref, '-beta') || inputs.force_release)
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: intel
          - os: macos-15
            arch: apple-silicon
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements.txt pyinstaller

      - name: PyInstaller 打包
        run: pyinstaller subdeck.spec --noconfirm

      - name: 组装发行包（SubDeck + ini 模板 + Mac 使用说明）
        id: zip
        shell: python
        env:
          TAG_NAME: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          import os, zipfile
          tag = os.environ["TAG_NAME"].lstrip("v")
          arch = os.environ["ARCH"]
          out = f"SubDeck-{tag}-macos-{arch}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              z.write("dist/SubDeck", "SubDeck")
              z.write("packaging/subdeck.ini", "subdeck.ini")
              z.write("packaging/使用说明-Mac.txt", "使用说明-Mac.txt")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"zip={out}\n")
          print("built", out)

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.zip }}
