name: Build UGOS Pro UPK

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: UGOS Pro package build number
        required: true
        default: "0001"
      release_tag:
        description: Optional GitHub Release tag to publish the UPK files to
        required: false
        default: ""

permissions:
  contents: write
  packages: read

env:
  GHCR_IMAGE: ghcr.io/sinailurus/subdeck

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Read application version
        run: |
          APP_VERSION=$(grep -oP '^APP_VERSION = "\K[\d.]+' app/main.py)
          test -n "$APP_VERSION"
          echo "APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"

      - name: Verify version consistency
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          APP_VERSION="${{ env.APP_VERSION }}"
          test "$(awk '/^version:/ { print $2 }' ugreen/subdeck-app/project.yaml)" = "${APP_VERSION}"
          grep -Fq "image: ${GHCR_IMAGE}:${APP_VERSION}" ugreen/subdeck-app/rootfs_common/docker-compose.yaml
          # parameters key 与 compose 引用一致
          python3 - <<'EOF'
          import re, yaml
          proj = yaml.safe_load(open("ugreen/subdeck-app/project.yaml"))
          compose = open("ugreen/subdeck-app/rootfs_common/docker-compose.yaml").read()
          keys = {p["key"] for p in proj["parameters"]}
          used = set(re.findall(r"\$\{(\w+)\}", compose))
          missing = keys - used
          assert not missing, f"compose 未引用 parameters: {missing}"
          print("parameters check ok:", sorted(keys))
          EOF
          # 指定 Release tag 时必须与 APP_VERSION 匹配（v 前缀）
          if [ -n "$RELEASE_TAG" ]; then
            test "$RELEASE_TAG" = "v${APP_VERSION}"
          fi

      - name: Prepare package directories
        run: |
          mkdir -p ugreen/subdeck-app/rootfs_amd64/images ugreen/subdeck-app/rootfs_arm64/images

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export amd64 image
        run: |
          docker pull --platform linux/amd64 ${GHCR_IMAGE}:${{ env.APP_VERSION }}
          test "$(docker image inspect ${GHCR_IMAGE}:${{ env.APP_VERSION }} --format '{{.Architecture}}')" = "amd64"
          docker save \
            -o ugreen/subdeck-app/rootfs_amd64/images/subdeck-${{ env.APP_VERSION }}-amd64.tar \
            ${GHCR_IMAGE}:${{ env.APP_VERSION }}
          docker image rm ${GHCR_IMAGE}:${{ env.APP_VERSION }}

      - name: Export arm64 image
        run: |
          docker pull --platform linux/arm64 ${GHCR_IMAGE}:${{ env.APP_VERSION }}
          test "$(docker image inspect ${GHCR_IMAGE}:${{ env.APP_VERSION }} --format '{{.Architecture}}')" = "arm64"
          docker save \
            -o ugreen/subdeck-app/rootfs_arm64/images/subdeck-${{ env.APP_VERSION }}-arm64.tar \
            ${GHCR_IMAGE}:${{ env.APP_VERSION }}
          docker image rm ${GHCR_IMAGE}:${{ env.APP_VERSION }}

      - name: Install verified ugcli
        run: |
          tool=ugcli-v1.1.0.13-linux-amd64
          curl -fsSL --connect-timeout 15 --max-time 60 --retry 2 --retry-all-errors \
            "https://osswaf.ugnas.com/pro/ugcli/download/$tool" \
            -o "$RUNNER_TEMP/$tool"
          echo "c455dd38def630db2566ae32d0850230ee89abbc948bd1df4819364e88b77713  $RUNNER_TEMP/$tool" | sha256sum -c -
          install -m 755 "$RUNNER_TEMP/$tool" /usr/local/bin/ugcli
          ugcli --version

      - name: Check and package UPK
        working-directory: ugreen/subdeck-app
        run: |
          ugcli check
          ugcli pack --arch all --build "${{ inputs.build_number }}"

      - name: Generate checksums
        working-directory: ugreen/subdeck-app/build_dir/pkgs/upk
        run: |
          find . -maxdepth 1 -type f -name '*.upk' -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum \
            > SHA256SUMS-UPK

      - name: Upload UPK packages
        uses: actions/upload-artifact@v4
        with:
          name: subdeck-ugos-pro-${{ env.APP_VERSION }}.${{ inputs.build_number }}
          path: |
            ugreen/subdeck-app/build_dir/pkgs/upk/*.upk
            ugreen/subdeck-app/build_dir/pkgs/upk/SHA256SUMS-UPK
            ugreen/subdeck-app/project.yaml
            ugreen/subdeck-app/rootfs_common/docker-compose.yaml
            ugreen/subdeck-app/rootfs_common/icon.png
            ugreen/README.md
          if-no-files-found: error
          retention-days: 30

      - name: Publish UPK packages to GitHub Release
        if: ${{ inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            ugreen/subdeck-app/build_dir/pkgs/upk/*.upk \
            ugreen/subdeck-app/build_dir/pkgs/upk/SHA256SUMS-UPK \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
